name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest test_build_index_freshness
      # Fails on missing frontmatter, a broken [[link]], an orphan or an unreached overview topic.
      - run: python3 build_index.py --strict
      # Fails if INDEX.md or llms.txt was not regenerated and committed.
      - run: git diff --exit-code INDEX.md llms.txt
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Topics needing torch, API keys or downloads are skipped, not failed.
      - run: python3 -m pip install numpy scipy scikit-learn pandas statsmodels matplotlib
      - run: python3 check_code.py --jobs 4
  torch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install numpy scipy scikit-learn pandas statsmodels matplotlib
      # CPU-only wheel: far smaller than the default CUDA build. Topics needing a GPU carry skip-check.
      - run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Only the topics that import torch; the code job already runs the rest.
      - run: python3 check_code.py --jobs 4 $(grep -rlE '^\s*(import|from) torch' --include=*.md concepts models llm-apps ml cv speech setup deployment scenarios)
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install -r requirements.txt
      # Django test client against the real topic files; a broken view fails here.
      # test_server.py also drives server.py's write path against a temp copy of the repo.
      - run: python3 manage.py test webapp
