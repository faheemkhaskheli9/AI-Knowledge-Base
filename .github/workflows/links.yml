name: Links
# Weekly check that every URL in a topic's `sources:` frontmatter still resolves.
# Not run on push: external sites flap, and a dead source should not block an edit.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # stdlib only. Fails on a dead or unreachable source; 403/429 (bot blocking,
      # rate limits) are annotated as warnings instead.
      - run: python3 check_links.py
